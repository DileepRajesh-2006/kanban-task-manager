<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanban Board</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="kanban.css">
</head>
<body class="container py-4">
  <div class="d-flex justify-content-between align-items-center">
    <h2 class="text-center flex-grow-1">Kanban Board</h2>
    <button class="btn btn-outline-secondary ms-3" onclick="toggleDarkMode()">🌓</button>
  </div>

  <!-- Task Input -->
  <div class="row my-3 g-2">
    <div class="col-md-3">
      <input type="text" id="taskInput" class="form-control" placeholder="Task Title">
    </div>
    <div class="col-md-2">
      <select id="prioritySelect" class="form-select">
        <option value="low">Low 🟢</option>
        <option value="medium">Medium 🟠</option>
        <option value="high">High 🔴</option>
      </select>
    </div>
    <div class="col-md-3">
      <input type="date" id="dueDate" class="form-control">
    </div>
    <div class="col-md-2">
      <button class="btn btn-primary w-100" onclick="addTask()">Add Task</button>
    </div>
    <div class="col-md-2">
      <input type="text" id="searchInput" class="form-control" placeholder="Search" oninput="renderTasks()">
    </div>
  </div>

  <!-- Export/Import -->
  <div class="mb-3">
    <button class="btn btn-success me-2" onclick="exportTasks()">⬇ Export</button>
    <input type="file" id="importFile" onchange="importTasks(event)">
  </div>

  <!-- Progress Bar -->
  <div class="progress mb-3">
    <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%">0%</div>
  </div>

  <!-- Kanban Board -->
  <div class="board row g-3">
    <div class="col column" id="todo" ondrop="drop(event)" ondragover="allowDrop(event)">
      <h5>To Do</h5>
    </div>
    <div class="col column" id="inprogress" ondrop="drop(event)" ondragover="allowDrop(event)">
      <h5>In Progress</h5>
    </div>
    <div class="col column" id="done" ondrop="drop(event)" ondragover="allowDrop(event)">
      <h5>Done</h5>
    </div>
  </div>

  <script src="kanban.js"></script>
</body>
</html>
