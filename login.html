<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <link rel="stylesheet" href="kanban.css" />
</head>
<body class="container py-5">
  <h2 class="text-center">Login</h2>
  <div class="w-50 mx-auto">
    <input type="text" id="loginUsername" class="form-control my-2" placeholder="Username">
    <input type="password" id="loginPassword" class="form-control my-2" placeholder="Password">
    <button class="btn btn-success w-100" onclick="login()">Login</button>
    <p class="text-center mt-2">Don't have an account? <a href="signup.html">Sign Up</a></p>
  </div>
  <script src="auth.js"></script>
</body>
</html>
