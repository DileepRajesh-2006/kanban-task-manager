<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="kanban.css" />
</head>
<body class="container py-5">
  <h2 class="text-center">Sign Up</h2>
  <div class="w-50 mx-auto">
    <input type="text" id="signupUsername" class="form-control my-2" placeholder="Username">
    <input type="password" id="signupPassword" class="form-control my-2" placeholder="Password">
    <button class="btn btn-primary w-100" onclick="signUp()">Sign Up</button>
    <p class="text-center mt-2">Already have an account? <a href="login.html">Login</a></p>
  </div>
  <script src="auth.js"></script>
</body>
</html>
